<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🧠</text></svg>" />
    <style>
      /* === Memora Bootstrap Fallback UI === */
      #memora-bootstrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #0a0a0b;
        color: #e4e4e7;
      }
      #memora-bootstrap[hidden] { display: none !important; }
      .bs-card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 32px;
        max-width: 560px;
        width: 100%;
        margin: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .bs-icon { font-size: 40px; margin-bottom: 16px; display: block; }
      .bs-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #fafafa; }
      .bs-subtitle { font-size: 13px; color: #a1a1aa; margin: 0 0 24px; line-height: 1.5; }
      .bs-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .bs-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
        border: 1px solid #3f3f46; background: #27272a; color: #e4e4e7;
        cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
      }
      .bs-btn:hover:not(:disabled) { background: #3f3f46; border-color: #52525b; }
      .bs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .bs-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
      .bs-btn.primary:hover:not(:disabled) { background: #1d4ed8; }
      .bs-btn .spinner {
        width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%; animation: bs-spin 0.6s linear infinite;
      }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      .bs-status {
        padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; line-height: 1.5;
      }
      .bs-status.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
      .bs-status.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
      .bs-status.info { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }
      .bs-log { margin-top: 16px; }
      .bs-log summary { font-size: 12px; color: #71717a; cursor: pointer; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
      .bs-log pre {
        margin: 8px 0 0; padding: 12px; border-radius: 8px; background: #09090b;
        color: #a1a1aa; font-size: 11px; line-height: 1.6; max-height: 220px;
        overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      .bs-footer { font-size: 11px; color: #52525b; margin-top: 20px; text-align: center; }
      .bs-footer a { color: #2563eb; }
      .bs-error-text { color: #fca5a5; font-size: 12px; margin-top: 8px; }
    </style>
    <script defer src="./assets/index-BieMsqix.js"></script>
    <link rel="stylesheet" href="./assets/style-D5sbHeGp.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Bootstrap fallback: visible until React app mounts and hides it -->
    <div id="memora-bootstrap">
      <div class="bs-card">
        <span class="bs-icon">🧠</span>
        <h1 class="bs-title">Memora Dashboard</h1>
        <p class="bs-subtitle">
          The dashboard frontend needs to be built before first use.<br />
          Click below to install dependencies and build the page.
        </p>
        <div class="bs-actions">
          <button class="bs-btn primary" id="bs-btn-install" onclick="doBootstrap('install')">
            📦 Install Dependencies
          </button>
          <button class="bs-btn primary" id="bs-btn-build" onclick="doBootstrap('build')">
            🔨 Build Page
          </button>
        </div>
        <div id="bs-status" hidden></div>
        <div id="bs-refresh" hidden style="text-align:center;margin-top:16px;">
          <button class="bs-btn primary" onclick="location.reload()">
            🔄 Refresh Page
          </button>
        </div>
        <details class="bs-log">
          <summary>Output Log</summary>
          <pre id="bs-log-content">Waiting for action...</pre>
        </details>
        <div id="bs-error" class="bs-error-text" hidden></div>
        <p class="bs-footer">
          Or run manually: <code style="background:#27272a;padding:2px 6px;border-radius:4px;">cd pages/dashboard && npm install && npm run build</code>
        </p>
      </div>
    </div>
    <script>
      // === Memora Bootstrap Script ===
      // Uses the AstrBot plugin page bridge to call backend API endpoints.
      // Requires no external dependencies.

      var bsRunning = false;
      var bsLog = document.getElementById('bs-log-content');
      var bsStatus = document.getElementById('bs-status');
      var bsError = document.getElementById('bs-error');
      var bsRefresh = document.getElementById('bs-refresh');
      var btnInstall = document.getElementById('bs-btn-install');
      var btnBuild = document.getElementById('bs-btn-build');

      function bsSetRunning(running) {
        bsRunning = running;
        btnInstall.disabled = running;
        btnBuild.disabled = running;
        if (running) {
          bsStatus.hidden = true;
          bsError.hidden = true;
          bsRefresh.hidden = true;
        }
      }

      function bsShowStatus(cls, msg) {
        bsStatus.className = 'bs-status ' + cls;
        bsStatus.innerHTML = msg;
        bsStatus.hidden = false;
      }

      function bsAppendLog(text) {
        bsLog.textContent = (bsLog.textContent === 'Waiting for action...' ? '' : bsLog.textContent + '\n') + text;
      }

      function bsGetBridgeContext() {
        try {
          var bridge = window.AstrBotPluginPage;
          if (bridge && typeof bridge.getContext === 'function') {
            return bridge.getContext();
          }
        } catch (_) {}
        return null;
      }

      function bsIsMemoraContext(ctx) {
        var pluginName = String((ctx && ctx.pluginName) || '').toLowerCase();
        var displayName = String((ctx && ctx.displayName) || '').toLowerCase();
        return pluginName.indexOf('memora') !== -1
          || pluginName.indexOf('livingmemory') !== -1
          || pluginName.indexOf('astrbot_plugin_memora') !== -1
          || displayName.indexOf('memora') !== -1
          || displayName.indexOf('livingmemory') !== -1;
      }

      function bsDetectWrongPluginResponse(response) {
        if (!response || typeof response !== 'object' || Array.isArray(response)) return null;
        if (response.status === 'ok' || response.status === 'error') return null;

        var overview = response.overview;
        var plugin = overview && overview.plugin;
        var pluginName = plugin && plugin.name;
        var displayName = plugin && (plugin.display_name || plugin.displayName);
        if (!pluginName && !displayName) return null;

        var currentCtx = bsGetBridgeContext();
        if (currentCtx && bsIsMemoraContext(currentCtx)) return null;

        return {
          pluginName: pluginName || 'unknown-plugin',
          displayName: displayName || pluginName || 'Unknown plugin',
        };
      }

      function bsExtractCommandResult(response) {
        if (!response || typeof response !== 'object' || Array.isArray(response)) return null;

        if (response.status === 'ok' && response.data && typeof response.data === 'object') {
          return response.data;
        }

        if (
          Object.prototype.hasOwnProperty.call(response, 'success')
          && Object.prototype.hasOwnProperty.call(response, 'exit_code')
        ) {
          return response;
        }

        return null;
      }

      async function doBootstrap(action) {
        if (bsRunning) return;
        bsSetRunning(true);

        var label = action === 'install' ? 'Installing dependencies...' : 'Building page...';
        var endpoint = 'page/dashboard/' + (action === 'install' ? 'install' : 'build');

        bsShowStatus('info', '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#93c5fd;border-radius:50%;animation:bs-spin 0.6s linear infinite;margin-right:8px;vertical-align:middle;"></span> ' + label);
        bsAppendLog('>>> ' + label);
        bsAppendLog('>>> Endpoint: ' + endpoint);

        try {
          var bridge = window.AstrBotPluginPage;
          if (!bridge || typeof bridge.apiPost !== 'function') {
            throw new Error('AstrBot bridge not available. Are you running inside AstrBot webview?');
          }

          var response = await bridge.apiPost(endpoint, {});
          bsAppendLog('<<< Response: ' + JSON.stringify(response, null, 2));

          var wrongPlugin = bsDetectWrongPluginResponse(response);
          if (wrongPlugin) {
            bsShowStatus(
              'error',
              '❌ <b>Wrong plugin panel:</b> this page is running inside <b>'
                + wrongPlugin.displayName
                + '</b> ('
                + wrongPlugin.pluginName
                + ') instead of <b>Memora</b>. Open the Memora plugin page in AstrBot and retry.'
            );
            bsAppendLog('!!! Wrong plugin context detected: ' + wrongPlugin.pluginName);
            return;
          }

          var data = bsExtractCommandResult(response);
          if (data) {
            var stdout = data.stdout || '';
            var stderr = data.stderr || '';
            var exitCode = data.exit_code;
            var success = data.success;

            if (stdout) bsAppendLog('--- stdout ---\n' + stdout);
            if (stderr) bsAppendLog('--- stderr ---\n' + stderr);

            if (success) {
              bsShowStatus('success', '✅ <b>Success!</b> ' + (action === 'install' ? 'Dependencies installed.' : 'Page built successfully.') + '<br><small>Exit code: ' + exitCode + '</small>');
              bsRefresh.hidden = false;
            } else {
              bsShowStatus('error', '❌ <b>Command failed</b> with exit code ' + exitCode + '<br><small>Check the output log for details.</small>');
            }
          } else {
            var msg = (response && response.message) || 'Unknown error';
            bsShowStatus('error', '❌ <b>API Error:</b> ' + msg);
            bsAppendLog('!!! API returned error: ' + msg);
          }
        } catch (e) {
          var message = (e && e.message) ? e.message : String(e);
          var bridgeUnavailable = !window.AstrBotPluginPage || message.indexOf('AstrBot bridge not available') !== -1;
          bsShowStatus('error', '❌ <b>Error:</b> ' + message);
          if (bridgeUnavailable) {
            bsError.textContent = 'Bridge error — make sure you are accessing this page through the AstrBot plugin panel.';
            bsError.hidden = false;
          } else {
            bsError.hidden = true;
            bsError.textContent = '';
          }
          bsAppendLog('!!! Exception: ' + message);
        } finally {
          bsSetRunning(false);
        }
      }

      // Auto-detect: if React app loads within 5 seconds, hide the bootstrap.
      // The React app will also explicitly call hideBootstrap() on mount.
      window._memoraBootstrapHidden = false;
      window.hideBootstrap = function() {
        if (window._memoraBootstrapHidden) return;
        window._memoraBootstrapHidden = true;
        var el = document.getElementById('memora-bootstrap');
        if (el) el.setAttribute('hidden', '');
      };
      // If React script loads successfully, it calls hideBootstrap() from main.tsx.
      // Fallback: hide after 15 seconds if React hasn't loaded (keep showing bootstrap).
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0 && root.children[0].children.length > 0) {
          window.hideBootstrap();
        }
      }, 15000);
    </script>
  </body>
</html>
