<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🧠</text></svg>" />

    <style>
      /* === Memora Bootstrap Fallback UI === */
      #memora-bootstrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #0a0a0b;
        color: #e4e4e7;
      }
      #memora-bootstrap[hidden] { display: none !important; }
      .bs-card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 16px;
        padding: 32px;
        max-width: 560px;
        width: 100%;
        margin: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      }
      .bs-icon { font-size: 40px; margin-bottom: 16px; display: block; }
      .bs-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; color: #fafafa; }
      .bs-subtitle { font-size: 13px; color: #a1a1aa; margin: 0 0 24px; line-height: 1.5; }
      .bs-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .bs-btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
        border: 1px solid #3f3f46; background: #27272a; color: #e4e4e7;
        cursor: pointer; transition: all 0.15s ease; white-space: nowrap;
      }
      .bs-btn:hover:not(:disabled) { background: #3f3f46; border-color: #52525b; }
      .bs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .bs-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
      .bs-btn.primary:hover:not(:disabled) { background: #1d4ed8; }
      .bs-btn .spinner {
        width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%; animation: bs-spin 0.6s linear infinite;
      }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      .bs-status {
        padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; line-height: 1.5;
      }
      .bs-status.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
      .bs-status.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
      .bs-status.info { background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.3); color: #93c5fd; }
      .bs-log { margin-top: 16px; }
      .bs-log summary { font-size: 12px; color: #71717a; cursor: pointer; -webkit-user-select: none; -moz-user-select: none; user-select: none; }
      .bs-log pre {
        margin: 8px 0 0; padding: 12px; border-radius: 8px; background: #09090b;
        color: #a1a1aa; font-size: 11px; line-height: 1.6; max-height: 220px;
        overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: "JetBrains Mono", "Fira Code", monospace;
      }
      .bs-footer { font-size: 11px; color: #52525b; margin-top: 20px; text-align: center; }
      .bs-footer a { color: #2563eb; }
      .bs-error-text { color: #fca5a5; font-size: 12px; margin-top: 8px; }
    </style>
    <script defer src="./assets/index-CphQkQNO.js"></script>
    <link rel="stylesheet" href="./assets/style-BxSZ8hTD.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Bootstrap fallback: visible until React app mounts and hides it -->
    <div id="memora-bootstrap">
      <div class="bs-card">
        <span class="bs-icon">🧠</span>
        <h1 class="bs-title" data-bs-i18n="title">Memora 管理面板</h1>
        <p class="bs-subtitle" data-bs-i18n="subtitle">管理面板前端在首次使用前需要构建。请在下方安装依赖并构建页面。</p>
        <div class="bs-actions">
          <button class="bs-btn primary" id="bs-btn-install" onclick="doBootstrap('install')">
            <span aria-hidden="true">📦</span><span data-bs-i18n="installDeps">安装依赖</span>
          </button>
          <button class="bs-btn primary" id="bs-btn-build" onclick="doBootstrap('build')">
            <span aria-hidden="true">🔨</span><span data-bs-i18n="buildPage">构建页面</span>
          </button>
        </div>
        <div id="bs-status" hidden></div>
        <div id="bs-refresh" hidden style="text-align:center;margin-top:16px;">
          <button class="bs-btn primary" onclick="location.reload()">
            <span aria-hidden="true">🔄</span><span data-bs-i18n="refreshPage">刷新页面</span>
          </button>
        </div>
        <details class="bs-log">
          <summary data-bs-i18n="outputLog">输出日志</summary>
          <pre id="bs-log-content">等待操作...</pre>
        </details>
        <div id="bs-error" class="bs-error-text" hidden></div>
        <p class="bs-footer">
          <span data-bs-i18n="manualPrefix">或手动运行：</span>
          <code style="background:#27272a;padding:2px 6px;border-radius:4px;">cd pages/dashboard && npm install && npm run build</code>
        </p>
      </div>
    </div>
    <script>
      // === Memora Bootstrap Script ===
      // Uses the AstrBot plugin page bridge to call backend API endpoints.
      // Requires no external dependencies.

      var BS_MESSAGES = {
        zh: {
          title: 'Memora 管理面板',
          subtitle: '管理面板前端在首次使用前需要构建。请在下方安装依赖并构建页面。',
          installDeps: '安装依赖',
          buildPage: '构建页面',
          refreshPage: '刷新页面',
          outputLog: '输出日志',
          waiting: '等待操作...',
          manualPrefix: '或手动运行：',
          installing: '正在安装依赖...',
          building: '正在构建页面...',
          endpointLog: '接口',
          responseLog: '响应',
          bridgeUnavailable: 'AstrBot bridge 不可用。请确认当前页面运行在 AstrBot WebView 中。',
          unknownPlugin: '未知插件',
          wrongPlugin: '<b>插件面板错误：</b>当前页面运行在 <b>{0}</b>（{1}）中，而不是 <b>Memora</b>。请在 AstrBot 中打开 Memora 插件页面后重试。',
          wrongPluginLog: '检测到错误的插件上下文：{0}',
          successTitle: '成功！',
          installSuccess: '依赖安装成功。',
          buildSuccess: '页面构建成功。',
          exitCode: '退出码',
          commandFailed: '命令执行失败，退出码为 {0}',
          checkOutput: '请查看输出日志了解详情。',
          unknownError: '未知错误',
          apiError: 'API 错误：',
          apiErrorLog: 'API 返回错误：{0}',
          error: '错误：',
          bridgeHint: 'Bridge 错误——请确认通过 AstrBot 插件面板访问此页面。',
          exceptionLog: '异常：{0}',
        },
        en: {
          title: 'Memora Dashboard',
          subtitle: 'The dashboard frontend needs to be built before first use. Click below to install dependencies and build the page.',
          installDeps: 'Install Dependencies',
          buildPage: 'Build Page',
          refreshPage: 'Refresh Page',
          outputLog: 'Output Log',
          waiting: 'Waiting for action...',
          manualPrefix: 'Or run manually:',
          installing: 'Installing dependencies...',
          building: 'Building page...',
          endpointLog: 'Endpoint',
          responseLog: 'Response',
          bridgeUnavailable: 'AstrBot bridge not available. Are you running inside AstrBot webview?',
          unknownPlugin: 'Unknown plugin',
          wrongPlugin: '<b>Wrong plugin panel:</b> this page is running inside <b>{0}</b> ({1}) instead of <b>Memora</b>. Open the Memora plugin page in AstrBot and retry.',
          wrongPluginLog: 'Wrong plugin context detected: {0}',
          successTitle: 'Success!',
          installSuccess: 'Dependencies installed.',
          buildSuccess: 'Page built successfully.',
          exitCode: 'Exit code',
          commandFailed: 'Command failed with exit code {0}',
          checkOutput: 'Check the output log for details.',
          unknownError: 'Unknown error',
          apiError: 'API Error:',
          apiErrorLog: 'API returned error: {0}',
          error: 'Error:',
          bridgeHint: 'Bridge error — make sure you are accessing this page through the AstrBot plugin panel.',
          exceptionLog: 'Exception: {0}',
        },
        ru: {
          title: 'Панель Memora',
          subtitle: 'Перед первым использованием необходимо собрать интерфейс панели. Установите зависимости и соберите страницу с помощью кнопок ниже.',
          installDeps: 'Установить зависимости',
          buildPage: 'Собрать страницу',
          refreshPage: 'Обновить страницу',
          outputLog: 'Лог вывода',
          waiting: 'Ожидание действия...',
          manualPrefix: 'Или выполните вручную:',
          installing: 'Установка зависимостей...',
          building: 'Сборка страницы...',
          endpointLog: 'Эндпоинт',
          responseLog: 'Ответ',
          bridgeUnavailable: 'Мост AstrBot недоступен. Откройте страницу внутри AstrBot WebView.',
          unknownPlugin: 'Неизвестный плагин',
          wrongPlugin: '<b>Ошибка панели плагина:</b> эта страница открыта в <b>{0}</b> ({1}), а не в <b>Memora</b>. Откройте страницу плагина Memora в AstrBot и повторите попытку.',
          wrongPluginLog: 'Обнаружен неверный контекст плагина: {0}',
          successTitle: 'Готово!',
          installSuccess: 'Зависимости установлены.',
          buildSuccess: 'Страница собрана.',
          exitCode: 'Код завершения',
          commandFailed: 'Команда завершилась ошибкой с кодом {0}',
          checkOutput: 'Подробности приведены в логе вывода.',
          unknownError: 'Неизвестная ошибка',
          apiError: 'Ошибка API:',
          apiErrorLog: 'API вернул ошибку: {0}',
          error: 'Ошибка:',
          bridgeHint: 'Ошибка моста — откройте эту страницу через панель плагина AstrBot.',
          exceptionLog: 'Исключение: {0}',
        },
      };

      function bsNormalizeLanguage(value) {
        var language = String(value || '').trim().toLowerCase().replace('_', '-').slice(0, 2);
        return Object.prototype.hasOwnProperty.call(BS_MESSAGES, language) ? language : null;
      }

      function bsResolveLanguage() {
        try {
          var storedLanguage = bsNormalizeLanguage(window.localStorage.getItem('memora_lang'));
          if (storedLanguage) return storedLanguage;
        } catch (_) {}

        var bridge = window.AstrBotPluginPage;
        try {
          if (bridge && typeof bridge.getLocale === 'function') {
            var bridgeLanguage = bsNormalizeLanguage(bridge.getLocale());
            if (bridgeLanguage) return bridgeLanguage;
          }
        } catch (_) {}

        try {
          if (bridge && typeof bridge.getContext === 'function') {
            var context = bridge.getContext();
            var contextLanguage = bsNormalizeLanguage(context && context.locale);
            if (contextLanguage) return contextLanguage;
          }
        } catch (_) {}

        return 'zh';
      }

      var bsLanguage = 'zh';

      function bsT(key) {
        var messages = BS_MESSAGES[bsLanguage] || BS_MESSAGES.zh;
        return messages[key] || BS_MESSAGES.zh[key] || key;
      }

      function bsFormat(key) {
        var text = bsT(key);
        for (var i = 1; i < arguments.length; i += 1) {
          text = text.split('{' + (i - 1) + '}').join(String(arguments[i]));
        }
        return text;
      }

      function bsEscapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      var bsRunning = false;
      var bsLog = document.getElementById('bs-log-content');
      var bsStatus = document.getElementById('bs-status');
      var bsError = document.getElementById('bs-error');
      var bsRefresh = document.getElementById('bs-refresh');
      var btnInstall = document.getElementById('bs-btn-install');
      var btnBuild = document.getElementById('bs-btn-build');
      var bsLogPristine = true;

      function bsApplyLanguage() {
        bsLanguage = bsResolveLanguage();
        document.documentElement.setAttribute(
          'lang',
          bsLanguage === 'en' ? 'en-US' : bsLanguage === 'ru' ? 'ru-RU' : 'zh-CN'
        );
        var elements = document.querySelectorAll('[data-bs-i18n]');
        for (var i = 0; i < elements.length; i += 1) {
          var key = elements[i].getAttribute('data-bs-i18n');
          elements[i].textContent = bsT(key);
        }
        if (bsLogPristine) bsLog.textContent = bsT('waiting');
      }

      bsApplyLanguage();

      function bsSetRunning(running) {
        bsRunning = running;
        btnInstall.disabled = running;
        btnBuild.disabled = running;
        if (running) {
          bsStatus.hidden = true;
          bsError.hidden = true;
          bsRefresh.hidden = true;
        }
      }

      function bsShowStatus(cls, msg) {
        bsStatus.className = 'bs-status ' + cls;
        bsStatus.innerHTML = msg;
        bsStatus.hidden = false;
      }

      function bsAppendLog(text) {
        bsLog.textContent = (bsLogPristine ? '' : bsLog.textContent + '\n') + text;
        bsLogPristine = false;
      }

      function bsGetBridgeContext() {
        try {
          var bridge = window.AstrBotPluginPage;
          if (bridge && typeof bridge.getContext === 'function') {
            return bridge.getContext();
          }
        } catch (_) {}
        return null;
      }

      function bsIsMemoraContext(ctx) {
        var pluginName = String((ctx && ctx.pluginName) || '').toLowerCase();
        var displayName = String((ctx && ctx.displayName) || '').toLowerCase();
        return pluginName.indexOf('memora') !== -1
          || pluginName.indexOf('astrbot_plugin_memora') !== -1
          || displayName.indexOf('memora') !== -1;
      }

      function bsDetectWrongPluginResponse(response) {
        if (!response || typeof response !== 'object' || Array.isArray(response)) return null;
        if (response.status === 'ok' || response.status === 'error') return null;

        var overview = response.overview;
        var plugin = overview && overview.plugin;
        var pluginName = plugin && plugin.name;
        var displayName = plugin && (plugin.display_name || plugin.displayName);
        if (!pluginName && !displayName) return null;

        var currentCtx = bsGetBridgeContext();
        if (currentCtx && bsIsMemoraContext(currentCtx)) return null;

        return {
          pluginName: pluginName || 'unknown-plugin',
          displayName: displayName || pluginName || bsT('unknownPlugin'),
        };
      }

      function bsExtractCommandResult(response) {
        if (!response || typeof response !== 'object' || Array.isArray(response)) return null;

        if (response.status === 'ok' && response.data && typeof response.data === 'object') {
          return response.data;
        }

        if (
          Object.prototype.hasOwnProperty.call(response, 'success')
          && Object.prototype.hasOwnProperty.call(response, 'exit_code')
        ) {
          return response;
        }

        return null;
      }

      async function doBootstrap(action) {
        if (bsRunning) return;
        bsApplyLanguage();
        bsSetRunning(true);

        var label = action === 'install' ? bsT('installing') : bsT('building');
        var endpoint = 'page/dashboard/' + (action === 'install' ? 'install' : 'build');

        bsShowStatus('info', '<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#93c5fd;border-radius:50%;animation:bs-spin 0.6s linear infinite;margin-right:8px;vertical-align:middle;"></span> ' + label);
        bsAppendLog('>>> ' + label);
        bsAppendLog('>>> ' + bsT('endpointLog') + ': ' + endpoint);

        try {
          var bridge = window.AstrBotPluginPage;
          if (!bridge || typeof bridge.apiPost !== 'function') {
            var bridgeError = new Error(bsT('bridgeUnavailable'));
            bridgeError.code = 'BRIDGE_UNAVAILABLE';
            throw bridgeError;
          }

          var response = await bridge.apiPost(endpoint, {});
          bsAppendLog('<<< ' + bsT('responseLog') + ': ' + JSON.stringify(response, null, 2));

          var wrongPlugin = bsDetectWrongPluginResponse(response);
          if (wrongPlugin) {
            bsShowStatus(
              'error',
              '❌ ' + bsFormat(
                'wrongPlugin',
                bsEscapeHtml(wrongPlugin.displayName),
                bsEscapeHtml(wrongPlugin.pluginName)
              )
            );
            bsAppendLog('!!! ' + bsFormat('wrongPluginLog', wrongPlugin.pluginName));
            return;
          }

          var data = bsExtractCommandResult(response);
          if (data) {
            var stdout = data.stdout || '';
            var stderr = data.stderr || '';
            var exitCode = data.exit_code;
            var success = data.success;

            if (stdout) bsAppendLog('--- stdout ---\n' + stdout);
            if (stderr) bsAppendLog('--- stderr ---\n' + stderr);

            if (success) {
              bsShowStatus(
                'success',
                '✅ <b>' + bsT('successTitle') + '</b> '
                  + (action === 'install' ? bsT('installSuccess') : bsT('buildSuccess'))
                  + '<br><small>' + bsT('exitCode') + ': ' + bsEscapeHtml(exitCode) + '</small>'
              );
              bsRefresh.hidden = false;
            } else {
              bsShowStatus(
                'error',
                '❌ <b>' + bsFormat('commandFailed', bsEscapeHtml(exitCode)) + '</b>'
                  + '<br><small>' + bsT('checkOutput') + '</small>'
              );
            }
          } else {
            var msg = (response && response.message) || bsT('unknownError');
            bsShowStatus('error', '❌ <b>' + bsT('apiError') + '</b> ' + bsEscapeHtml(msg));
            bsAppendLog('!!! ' + bsFormat('apiErrorLog', msg));
          }
        } catch (e) {
          var message = (e && e.message) ? e.message : String(e);
          var bridgeUnavailable = !window.AstrBotPluginPage || (e && e.code === 'BRIDGE_UNAVAILABLE');
          bsShowStatus('error', '❌ <b>' + bsT('error') + '</b> ' + bsEscapeHtml(message));
          if (bridgeUnavailable) {
            bsError.textContent = bsT('bridgeHint');
            bsError.hidden = false;
          } else {
            bsError.hidden = true;
            bsError.textContent = '';
          }
          bsAppendLog('!!! ' + bsFormat('exceptionLog', message));
        } finally {
          bsSetRunning(false);
        }
      }

      // Auto-detect: if React app loads within 5 seconds, hide the bootstrap.
      // The React app will also explicitly call hideBootstrap() on mount.
      window._memoraBootstrapHidden = false;
      window.hideBootstrap = function() {
        if (window._memoraBootstrapHidden) return;
        window._memoraBootstrapHidden = true;
        var el = document.getElementById('memora-bootstrap');
        if (el) el.setAttribute('hidden', '');
      };
      // If React script loads successfully, it calls hideBootstrap() from main.tsx.
      // Fallback: hide after 15 seconds if React hasn't loaded (keep showing bootstrap).
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0 && root.children[0].children.length > 0) {
          window.hideBootstrap();
        }
      }, 15000);
    </script>
  </body>
</html>
