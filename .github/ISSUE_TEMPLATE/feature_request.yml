name: 功能建议
description: 提议能够解决明确问题的新能力或改进
title: "[Feature]: "
labels:
  - "type: feature"
  - "status: needs-triage"
assignees: []
body:
  - type: markdown
    attributes:
      value: 使用咨询请前往 Discussions。请先描述问题，再说明建议方案。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 这不是普通安装、配置或使用咨询。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景、当前限制和受影响用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为，不要求设计内部实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明尝试过的绕行方式或其他可选设计。
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: 可能影响的范围
      options:
        - label: 后端或存储
        - label: Dashboard
        - label: 配置或 API
        - label: 隐私、安全或兼容性
        - label: 文档
  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意参与实现
      options:
        - 可以参与
        - 需要维护者指导
        - 暂时不能参与
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可选。添加原型、相关链接或其他上下文。
