name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Validate config schema
        if: ${{ hashFiles('scripts/validate_conf_schema.py') != '' }}
        run: uv run --locked python scripts/validate_conf_schema.py

      - name: Run backend regression tests
        run: uv run --locked pytest tests -q

      - name: Run smoke tests
        run: uv run --locked python scripts/run_smoke.py -q

  blackbox-bootstrap:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.x"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Run AstrBot black-box bootstrap
        run: uv run --locked python scripts/run_astrbot_blackbox.py -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pages/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: pages/dashboard
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: pages/dashboard
        run: npx playwright install --with-deps chromium

      - name: Test dashboard
        working-directory: pages/dashboard
        run: npm run test

      - name: Build dashboard
        working-directory: pages/dashboard
        run: npm run build

      - name: Check dashboard artifacts
        working-directory: pages/dashboard
        run: npm run check:artifacts

      - name: Run dashboard runtime smoke
        working-directory: pages/dashboard
        run: npm run smoke:runtime

      - name: Run dashboard browser smoke
        working-directory: pages/dashboard
        run: npm run smoke:browser

      - name: Upload browser smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-smoke-${{ github.run_id }}
          path: /tmp/memora-dashboard-browser-smoke-screenshots
          if-no-files-found: ignore
          retention-days: 7
