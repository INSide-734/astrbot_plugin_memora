name: M1 Gate

# pull_request_target：workflow 定义取自 base 分支，绝不 checkout/执行候选。
# verifier-only bootstrap：workflow 不执行候选、不自生成探针证据；production
# cut 必须提供外部受信、可认证且绑定当前 candidate 的 attestation（受保护
# OS attestor 以仓库外私钥签名 + 身份 + run nonce + 受保护传输），缺失/
# 未认证一律 exit 2（attestor 是受保护基础设施前置）。受信 consumer 以
# 持有目录 FD（openat/fstat）完成验证与发布（no-follow/TOCTOU 闭合），
# 校验并以 run-id/attempt 绑定 staging，全量复验后原子发布，仅 rc=0 上传。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # 仅受信观察者步骤（artifact 上传）使用；候选执行域（容器）无任何 token。
  actions: write

# 按 PR number 并发：同一 PR 的新事件取消旧运行，不同 PR 互不影响；
# 不按 github.ref（target 事件下是 base ref，会让同目标分支 PR 相互取消）。
concurrency:
  group: m1-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  m1-gate:
    name: 受信双树 M1 门禁（只读，base-owned；候选仅在隔离容器域执行）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 固定安全目录（任何失败前确定，候选不可控制）
        id: paths
        shell: bash
        run: |
          echo "report_dir=${RUNNER_TEMP}/m1-gate-report/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "checker_dir=${RUNNER_TEMP}/m1-gate-base" >> "${GITHUB_OUTPUT}"
          echo "staging_dir=${RUNNER_TEMP}/m1-gate-verified/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "attestation_dir=${RUNNER_TEMP}/m1-attestation" >> "${GITHUB_OUTPUT}"

      - name: 校验 PR number 与三个提交 SHA
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::PR number 不是正整数: ${PR_NUMBER}"; exit 2; }
          for v in BASE_SHA PR_HEAD_SHA MERGE_SHA; do
            if [[ ! "${!v}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${v} 不是完整 40 位十六进制 SHA: ${!v}"; exit 2
            fi
          done
          echo "base=${BASE_SHA}" >> "${GITHUB_ENV}"
          echo "pr_head=${PR_HEAD_SHA}" >> "${GITHUB_ENV}"
          echo "merge=${MERGE_SHA}" >> "${GITHUB_ENV}"
          echo "M1_NONCE=$(openssl rand -hex 32)" >> "${GITHUB_ENV}"

      - name: 检出 base 分支（pull_request_target 下 checkout 仅 base-owned）
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: 定向 fetch PR refs 到固定 ref 并核对 OID（完整对象历史）
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 跨 step 数据流：显式从 GITHUB_ENV 写入名（pr_head/merge）映射，
          # 不引用本 step 未声明的名称（env 不跨 step）。
          PR_HEAD_SHA: ${{ env.pr_head }}
          MERGE_SHA: ${{ env.merge }}
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/m1/pr-head" \
            "+refs/pull/${PR_NUMBER}/merge:refs/m1/pr-merge"
          [ "$(git rev-parse refs/m1/pr-head)" = "${PR_HEAD_SHA}" ] || {
            echo "::error::refs/pull/${PR_NUMBER}/head OID 与事件 PR_HEAD_SHA 不符"; exit 2; }
          [ "$(git rev-parse refs/m1/pr-merge)" = "${MERGE_SHA}" ] || {
            echo "::error::refs/pull/${PR_NUMBER}/merge OID 与事件 MERGE_SHA 不符"; exit 2; }

      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 从 base 导出完整 checker（失败不回退到候选 checkout）
        id: checker
        shell: bash
        env:
          BASE_SHA: ${{ env.base }}
          CHECKER_DIR: ${{ steps.paths.outputs.checker_dir }}
        run: |
          mkdir -p "${CHECKER_DIR}"
          # 完整传递信任根：CLI + core + analysis + report + architecture
          # 依赖，全部 stdlib；m1_gate_probe.py 是受保护参考 producer，
          # 不参与 bootstrap 裁决。只允许从真实 BASE_SHA 导出。
          git archive "${BASE_SHA}" \
            scripts/check_m1_gate.py \
            scripts/m1_gate_core.py \
            scripts/m1_gate_analysis.py \
            scripts/m1_gate_report.py \
            scripts/architecture_core.py \
            scripts/architecture_analysis.py \
            scripts/architecture_snapshots.py \
            | tar -x -C "${CHECKER_DIR}"
          for f in \
            scripts/check_m1_gate.py \
            scripts/m1_gate_core.py \
            scripts/m1_gate_analysis.py \
            scripts/m1_gate_report.py \
            scripts/architecture_core.py \
            scripts/architecture_analysis.py \
            scripts/architecture_snapshots.py; do
            if [[ ! -f "${CHECKER_DIR}/${f}" ]]; then
              echo "::error::BASE_SHA 中不存在 ${f}（bootstrap PR 需人工复审）"
              exit 2
            fi
          done
          CHECKER_SHA="$(git rev-parse "${BASE_SHA}:scripts/check_m1_gate.py")"
          echo "checker_sha=${CHECKER_SHA}" >> "${GITHUB_OUTPUT}"

      - name: 自检导出副本真实可启动（stdlib，无候选依赖）
        shell: bash
        env:
          CHECKER_DIR: ${{ steps.paths.outputs.checker_dir }}
        run: |
          PYTHONPATH="${CHECKER_DIR}/scripts" \
            python3 "${CHECKER_DIR}/scripts/check_m1_gate.py" --help >/dev/null
          python3 -m py_compile \
            "${CHECKER_DIR}/scripts/check_m1_gate.py" \
            "${CHECKER_DIR}/scripts/m1_gate_core.py" \
            "${CHECKER_DIR}/scripts/m1_gate_analysis.py" \
            "${CHECKER_DIR}/scripts/m1_gate_report.py"

      - name: 运行 base-owned M1 gate（保存 rc，避免丢失退出码）
        id: m1
        shell: bash
        env:
          BASE_SHA: ${{ env.base }}
          PR_HEAD_SHA: ${{ env.pr_head }}
          MERGE_SHA: ${{ env.merge }}
          CHECKER_DIR: ${{ steps.paths.outputs.checker_dir }}
          REPORT_DIR: ${{ steps.paths.outputs.report_dir }}
          # 外部受信 attestation（受保护基础设施前置）：bootstrap 阶段该
          # 路径不存在且无密钥，production cut 一律 exit 2（fail-closed）。
          ATTESTATION: ${{ steps.paths.outputs.attestation_dir }}/attestation.json
        run: |
          set +e
          PYTHONPATH="${CHECKER_DIR}/scripts" \
            python3 "${CHECKER_DIR}/scripts/check_m1_gate.py" \
            --repository "$GITHUB_WORKSPACE" \
            --base-commit "${BASE_SHA}" \
            --pr-head-commit "${PR_HEAD_SHA}" \
            --candidate-commit "${MERGE_SHA}" \
            --report-dir "${REPORT_DIR}" \
            --probe-result "${ATTESTATION}" \
            --attestation-nonce "${M1_NONCE}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          echo "M1 gate exit=${rc}"
          exit 0

      - name: 受信 consumer 验证并发布精确报告集合
        id: cons
        if: ${{ always() }}
        shell: bash
        env:
          CHECKER_DIR: ${{ steps.paths.outputs.checker_dir }}
          REPORT_DIR: ${{ steps.paths.outputs.report_dir }}
          STAGING_DIR: ${{ steps.paths.outputs.staging_dir }}
        run: |
          set +e
          PYTHONPATH="${CHECKER_DIR}/scripts" \
            python3 "${CHECKER_DIR}/scripts/m1_gate_report.py" \
            --publish "${REPORT_DIR}" "${STAGING_DIR}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          echo "M1 gate consumer exit=${rc}"
          exit 0

      - name: 上传验证后的 M1 门禁报告集合（仅 consumer rc=0 时）
        if: ${{ steps.cons.outputs.rc == '0' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.staging_dir }}/
          if-no-files-found: error
          retention-days: 14

      - name: 以 M1 gate/consumer 退出码结束
        if: ${{ always() }}
        shell: bash
        env:
          M1_RC: ${{ steps.m1.outputs.rc }}
          CONS_RC: ${{ steps.cons.outputs.rc }}
        run: |
          if [[ "${M1_RC}" != "0" ]]; then
            echo "M1 gate 阻断（exit ${M1_RC}），详见上传报告"
            exit "${M1_RC}"
          fi
          echo "M1 gate consumer exit=${CONS_RC}"
          exit "${CONS_RC}"
