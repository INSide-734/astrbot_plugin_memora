version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area: core"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /pages/dashboard
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area: dashboard"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "area: github"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
